repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.6
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi, jupyter, pyproject]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter, pyproject]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # 最新のバージョンを指定
    hooks:
      - id: check-yaml
        name: Check YAML
        description: YAMLファイルの構文エラーをチェック
      - id: check-toml
        name: Check TOML
        description: TOMLファイルの構文エラーをチェック
      - id: end-of-file-fixer
        name: Fix End of Files
        description: ファイル末尾を改行で終わらせる（推奨）
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: 行末の不要な空白を削除（推奨）

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
