[project]
name = "snklogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Takanashi", email = "nao69alter@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
snklogs = "snklogs:main"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 80
cache-dir = ".ci_cache/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["snklogs"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
cache_dir = ".ci_cache/.mypy_cache"
strict = true
show_error_codes = true
incremental = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
cache_dir = ".ci_cache/.pytest_cache"
log_cli = false
