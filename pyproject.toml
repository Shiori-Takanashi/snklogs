[project]
name = "snklogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takanashi", email = "nao69alter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
snklogs = "snklogs:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.ruff]
cache-dir = ".ci_cache/.ruff_cache"
target-version = "py312"
line-length = 80

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
order-by-type = true
known-first-party = ["snklogs"]

[tool.mypy]
cache_dir = ".ci_cache/.mypy_cache"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".ci_cache/.pytest_cache"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --durations=5"
log_cli = true
log_cli_level = "INFO"
