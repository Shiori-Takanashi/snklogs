name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy --ignore-missing-imports src tests

      - name: Run tests and generate reports
        run: |
          mkdir -p .ci_cache/.pytest_reports
          uv run pytest \
            --junitxml=.ci_cache/.pytest_reports/report.xml \
            --html=.ci_cache/.pytest_reports/report.html \
            --self-contained-html
